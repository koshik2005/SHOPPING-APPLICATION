# ==============================================================================
# HyperLocal Auth Service — Production-Ready Configuration
# ==============================================================================

server.port=8081

# --- Application ---
spring.application.name=hyperlocal-auth-service
spring.profiles.active=dev

# --- PostgreSQL Configuration ---
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:hyperlocal_auth_db}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USER:hyperlocal_user}
spring.datasource.password=${DB_PASS:hyperlocal_secure_pass}

# --- JPA / Hibernate ---
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# --- Flyway Migrations ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# --- Redis Configuration ---
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# --- RabbitMQ Configuration ---
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASS:guest}

# --- SMTP / MailHog (Development) ---
# MailHog web UI: http://localhost:8025
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.from=${SMTP_FROM:noreply@hyperlocal.app}
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# --- Google OAuth Web Client ID ---
google.client.web-id=${GOOGLE_CLIENT_WEB_ID:1086613811908-vf6okpd8jvr0f5oaqvnemujb7niooe7k.apps.googleusercontent.com}

# --- JWT ---
jwt.secret=${JWT_SECRET:HyperLocalDevSecretKeyForJWTSigningMinimum256BitsLong!}
jwt.expiry.access=${JWT_EXPIRY_ACCESS:900}
jwt.expiry.refresh=${JWT_EXPIRY_REFRESH:86400}

# --- Actuator & Observability ---
management.endpoints.web.exposure.include=health,prometheus,metrics,info
management.endpoint.health.show-details=always

# --- Logging (MDC Correlation ID in pattern) ---
logging.level.com.hyperlocal=DEBUG
logging.level.org.springframework.web=INFO
logging.level.root=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{X-Correlation-ID}] %logger{36} - %msg%n
