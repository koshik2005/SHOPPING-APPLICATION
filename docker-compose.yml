      <<: *healthcheck-defaults

  cart-service:
    build:
      context: ./hyperlocal-platform
      dockerfile: Dockerfile.service
      args:
        SERVICE_PATH: hyperlocal-services/business/cart-service
        SERVICE_JAR: hyperlocal-services/business/cart-service/target/cart-service-1.0.0-SNAPSHOT.jar
    container_name: hyperlocal-cart-service
    environment:
      <<: *common-env
    networks:
      - hyperlocal-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8096/actuator/health"]
