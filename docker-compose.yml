      context: ./hyperlocal-platform
      dockerfile: Dockerfile.service
      args:
        SERVICE_PATH: hyperlocal-services/business/shop-service
        SERVICE_JAR: hyperlocal-services/business/shop-service/target/shop-service-1.0.0-SNAPSHOT.jar
