  search-service:
    build:
      context: ./hyperlocal-platform
      dockerfile: Dockerfile.service
      args:
        SERVICE_PATH: hyperlocal-services/business/search-service
        SERVICE_JAR: hyperlocal-services/business/search-service/target/search-service-1.0.0-SNAPSHOT.jar
    container_name: hyperlocal-search-service
    environment:
      <<: *common-env
    networks:
      - hyperlocal-network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8089/actuator/health"]
      <<: *healthcheck-defaults

  shop-service:
