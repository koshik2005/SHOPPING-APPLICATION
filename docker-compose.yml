      context: ./hyperlocal-platform
      dockerfile: Dockerfile.service
      args:
        SERVICE_PATH: hyperlocal-services/business/support-service
        SERVICE_JAR: hyperlocal-services/business/support-service/target/support-service-1.0.0-SNAPSHOT.jar
    container_name: hyperlocal-support-service
    environment:
      <<: *common-env
    networks:
      - hyperlocal-network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8098/actuator/health"]
      <<: *healthcheck-defaults
