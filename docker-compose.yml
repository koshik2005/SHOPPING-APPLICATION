      context: ./hyperlocal-platform
      dockerfile: Dockerfile.service
      args:
        SERVICE_PATH: hyperlocal-services/business/wallet-service
        SERVICE_JAR: hyperlocal-services/business/wallet-service/target/wallet-service-1.0.0-SNAPSHOT.jar
    container_name: hyperlocal-wallet-service
