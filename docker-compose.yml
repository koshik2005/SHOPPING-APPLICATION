      context: ./hyperlocal-platform
      dockerfile: Dockerfile.service
      args:
        SERVICE_PATH: hyperlocal-services/business/delivery-service
        SERVICE_JAR: hyperlocal-services/business/delivery-service/target/delivery-service-1.0.0-SNAPSHOT.jar
